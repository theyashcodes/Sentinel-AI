<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel AI Shield</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 350px;
      background-color: #0A0A0A;
      color: #EDEDED;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.05em;
      color: #FFFFFF;
    }
    .brand svg {
      width: 18px;
      height: 18px;
      color: #3B82F6;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 600;
      color: #10B981;
      background: rgba(16, 185, 129, 0.1);
      padding: 2px 8px;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 6px #10B981;
    }
    .card {
      background: #141414;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px;
      margin-bottom: 12px;
    }
    .target-url {
      font-size: 11px;
      color: #94A3B8;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin-top: 4px;
      line-height: 1.4;
    }
    .domain-title {
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .score-val {
      font-size: 26px;
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .verdict-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      letter-spacing: 0.04em;
    }
    .alert-banner {
      background: rgba(220, 38, 38, 0.1);
      border-left: 3px solid #DC2626;
      border: 1px solid rgba(220, 38, 38, 0.3);
      padding: 10px;
      margin-bottom: 12px;
      font-size: 11px;
      color: #F87171;
      line-height: 1.4;
    }
    .threat-list {
      list-style: none;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .threat-item {
      font-size: 11px;
      color: #E2E8F0;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      line-height: 1.35;
    }
    .btn {
      width: 100%;
      height: 36px;
      background: #3B82F6;
      color: #FFFFFF;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #2563EB;
    }
    .btn-secondary {
      background: #1E293B;
      color: #94A3B8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #FFFFFF;
    }
    .loading-state {
      text-align: center;
      padding: 24px 0;
      color: #94A3B8;
      font-size: 12px;
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #64748B;
      margin-top: 14px;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      SENTINEL AI
    </div>
    <div class="status-badge">
      <div class="pulse-dot"></div>
      ACTIVE SHIELD
    </div>
  </div>

  <div id="content">
    <div class="loading-state">
      Scanning current page with Sentinel Neural Engine...
    </div>
  </div>

  <div class="footer">
    Sentinel AI • Local Real-Time Defense
  </div>

  <script src="popup.js"></script>
</body>
</html>
